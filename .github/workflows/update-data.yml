name: Update World Street Rarity data

on:
  schedule:
    # Once a year (January 1st, 03:00 UTC)
    - cron: "0 3 1 1 *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated country codes (leave empty for all configured countries)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build pilot country data from Overture Maps
        run: |
          if [ -n "${{ github.event.inputs.countries }}" ]; then
            python scripts/build_data.py --countries "${{ github.event.inputs.countries }}" --workers 4
          else
            python scripts/build_data.py --workers 4
          fi

      - name: Enrich cities with Wikidata founding years
        run: python scripts/enrich_wikidata.py

      - name: Run tests
        run: pytest -q

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh world street rarity data $(date -u +%Y-%m-%d)"
            git push origin main
          fi
